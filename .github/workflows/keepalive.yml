name: Supabase keepalive

on:
  schedule:
    - cron: "0 3 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read the leaderboard
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://eyhqfkbajoltsyxbneps.supabase.co/rest/v1/scores?select=name&limit=1" \
            -H "apikey: sb_publishable_UQ1KJiNvlOaInbguwZxrjA_KmvH-WfV")
          echo "Supabase answered: $code"
          test "$code" = "200"
